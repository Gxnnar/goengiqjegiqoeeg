<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Failover Static Search Dashboard</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --container-bg: #1f1f1f;
            --accent-color: #ff0000;
            --accent-hover: #cc0000;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #3f3f3f;
            --card-hover: #2a2a2a;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .dashboard-container {
            max-width: 1000px;
            width: 100%;
            background-color: var(--container-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            font-size: 26px;
        }

        .search-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-main);
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        button {
            padding: 12px 24px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .player-window {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            background-color: #000;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
            display: none;
        }

        .player-window iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .results-heading {
            font-size: 18px;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
            display: none;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }

        .video-card {
            background-color: var(--bg-color);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid transparent;
            transition: transform 0.2s, background-color 0.2s, border-color 0.2s;
        }

        .video-card:hover {
            transform: translateY(-4px);
            background-color: var(--card-hover);
            border-color: var(--border-color);
        }

        .video-card img {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            display: block;
        }

        .video-info {
            padding: 10px;
        }

        .video-title {
            font-size: 14px;
            font-weight: 600;
            margin: 0 0 6px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
        }

        .video-author {
            font-size: 12px;
            color: var(--text-muted);
            margin: 0;
        }

        .status-msg {
            text-align: center;
            color: var(--text-muted);
            padding: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <h1>Robust Static Media Dashboard</h1>
    
    <div class="search-row">
        <input type="text" id="searchQuery" placeholder="Type video title here..." autocomplete="off">
        <button id="searchBtn">Search</button>
    </div>

    <div class="player-window" id="playerContainer">
        <iframe id="videoEmbed" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
    </div>

    <div class="results-heading" id="resultsTitle">Search Results</div>
    <div id="statusMessage" class="status-msg">Enter a title above to look up videos.</div>
    <div class="results-grid" id="resultsGrid"></div>
</div>

<script>
    const searchBtn = document.getElementById('searchBtn');
    const searchQuery = document.getElementById('searchQuery');
    const resultsGrid = document.getElementById('resultsGrid');
    const resultsTitle = document.getElementById('resultsTitle');
    const statusMessage = document.getElementById('statusMessage');
    const playerContainer = document.getElementById('playerContainer');
    const videoEmbed = document.getElementById('videoEmbed');

    // A redundant list of open public API servers to rotate through if one is down
    const backupGateways = [
        'https://perennialte.ch',
        'https://melmac.space',
        'https://flokinet.to',
        'https://yewtu.be',
        'https://projectsegfaut.biz'
    ];

    searchBtn.addEventListener('click', executeVideoSearch);
    searchQuery.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') executeVideoSearch();
    });

    async function executeVideoSearch() {
        const query = searchQuery.value.trim();
        if (!query) return;

        statusMessage.textContent = 'Contacting server network... Please wait.';
        statusMessage.style.display = 'block';
        resultsGrid.innerHTML = '';
        resultsTitle.style.display = 'none';

        let successfulData = null;

        // Loop through alternative endpoints automatically if a failure happens
        for (let i = 0; i < backupGateways.length; i++) {
            const currentHost = backupGateways[i];
            try {
                statusMessage.textContent = `Searching via Node ${i + 1}/${backupGateways.length}...`;
                
                // Add a 6-second timeout barrier so the code doesn't hang on a dead server
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 6000);

                const response = await fetch(`${currentHost}/api/v1/search?q=${encodeURIComponent(query)}&type=video`, {
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);

                if (response.ok) {
                    successfulData = await response.json();
                    console.log(`Success obtained via gateway node: ${currentHost}`);
                    break; // Exit loop completely upon valid response data
                }
            } catch (err) {
                console.warn(`Gateway node ${currentHost} rejected query or timed out.`);
            }
        }

        if (successfulData) {
            displayGridResults(successfulData);
        } else {
            statusMessage.textContent = 'All regional search gateways are currently occupied. Please click Search again to retry.';
        }
    }

    function displayGridResults(items) {
        if (!items || items.length === 0) {
            statusMessage.textContent = 'No matching videos found for this search string.';
            return;
        }

        statusMessage.style.display = 'none';
        resultsTitle.style.display = 'block';

        items.forEach(item => {
            if (item.type !== 'video' || !item.videoId) return;

            const card = document.createElement('div');
            card.className = 'video-card';
            
            // Standardizing fallback thumbnails in case direct hotlinks are broken
            let thumbnailSrc = 'https://unsplash.com';
            if (item.videoThumbnails && item.videoThumbnails.length > 0) {
                // Find or default to high quality
                const foundThumb = item.videoThumbnails.find(t => t.quality === 'high' || t.quality === 'medium');
                thumbnailSrc = foundThumb ? foundThumb.url : item.videoThumbnails[0].url;
            }

            card.innerHTML = `
                <img src="${thumbnailSrc}" alt="Preview" onerror="this.src='https://unsplash.com'">
                <div class="video-info">
                    <p class="video-title">${escapeHtml(item.title)}</p>
                    <p class="video-author">${escapeHtml(item.author || 'Channel')}</p>
                </div>
            `;

            card.addEventListener('click', () => {
                playTargetVideo(item.videoId);
            });

            resultsGrid.appendChild(card);
        });
    }

    function playTargetVideo(id) {
        videoEmbed.src = `https://youtube-nocookie.com{id}?autoplay=1`;
        playerContainer.style.display = 'block';
        playerContainer.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function escapeHtml(text) {
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
