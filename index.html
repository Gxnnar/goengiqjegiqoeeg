<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standalone Search Dashboard</title>
    <style>
        :root {
            --bg-color: #0d0e12;
            --container-bg: #161820;
            --accent-color: #ff3333;
            --accent-hover: #dd2222;
            --text-main: #f0f2f5;
            --text-muted: #8a8f9d;
            --border-color: #2b2e3a;
            --card-bg: #1f222e;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .dashboard-container {
            max-width: 950px;
            width: 100%;
            background-color: var(--container-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            font-size: 24px;
            letter-spacing: 0.5px;
        }

        .search-row {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        input {
            flex: 1;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-main);
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        button {
            padding: 14px 28px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        /* Responsive Player Container */
        .player-window {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            background-color: #000;
            border-radius: 10px;
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
            display: none;
        }

        .player-window iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .results-heading {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            display: none;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .video-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .video-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

        .thumb-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #000;
        }

        .video-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .video-info {
            padding: 12px;
        }

        .video-title {
            font-size: 14px;
            font-weight: 600;
            margin: 0 0 4px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
        }

        .video-author {
            font-size: 12px;
            color: var(--text-muted);
            margin: 0;
        }

        .status-msg {
            text-align: center;
            color: var(--text-muted);
            padding: 30px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <h1>Direct Search Engine Media Center</h1>
    
    <div class="search-row">
        <input type="text" id="searchQuery" placeholder="What video title are you looking for?" autocomplete="off">
        <button id="searchBtn">Search</button>
    </div>

    <!-- Main Viewport Player -->
    <div class="player-window" id="playerContainer">
        <iframe id="videoEmbed" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
    </div>

    <!-- Layout Grid -->
    <div class="results-heading" id="resultsTitle">Discovered Videos</div>
    <div id="statusMessage" class="status-msg">Type a query above to scan for videos.</div>
    <div class="results-grid" id="resultsGrid"></div>
</div>

<script>
    const searchBtn = document.getElementById('searchBtn');
    const searchQuery = document.getElementById('searchQuery');
    const resultsGrid = document.getElementById('resultsGrid');
    const resultsTitle = document.getElementById('resultsTitle');
    const statusMessage = document.getElementById('statusMessage');
    const playerContainer = document.getElementById('playerContainer');
    const videoEmbed = document.getElementById('videoEmbed');

    searchBtn.addEventListener('click', executeDirectSearch);
    searchQuery.addEventListener('keypress', (e) => { e.key === 'Enter' && executeDirectSearch(); });

    async function executeDirectSearch() {
        const query = searchQuery.value.trim();
        if (!query) return;

        statusMessage.textContent = 'Searching the web...';
        statusMessage.style.display = 'block';
        resultsGrid.innerHTML = '';
        resultsTitle.style.display = 'none';

        try {
            // Target the DuckDuckGo HTML parser engine directly to parse search layout objects without external scrapers
            const targetUrl = `https://duckduckgo.com{encodeURIComponent(query + ' site:youtube.com/watch')}`;
            
            const response = await fetch(targetUrl);
            if (!response.ok) throw new Error();

            const htmlText = await response.text();
            
            // Build a virtual browser Document fragment to parse the incoming text safely via native DOM
            const parser = new DOMParser();
            const virtualDoc = parser.parseFromString(htmlText, 'text/html');
            const searchResults = virtualDoc.querySelectorAll('.web-result');

            processExtractedNodes(searchResults);
        } catch (error) {
            // Failover to secondary open query lookup syntax if CORS configurations strictly isolate standard DOM parsing
            fallbackQueryAlternative(query);
        }
    }

    function processExtractedNodes(nodes) {
        const parsedVideos = [];

        nodes.forEach(node => {
            const linkElement = node.querySelector('.result__url');
            const titleElement = node.querySelector('.result__title');
            const snippetElement = node.querySelector('.result__snippet');

            if (!linkElement || !titleElement) return;

            const url = linkElement.href || linkElement.textContent;
            const title = titleElement.textContent.trim();
            const snippet = snippetElement ? snippetElement.textContent.trim() : '';

            // Cleanly extract the 11 character token out of any found watch addresses
            const idMatch = url.match(/(?:v=|watch\?v=)([a-zA-Z0-9_-]{11})/);
            
            if (idMatch && idMatch[1]) {
                const videoId = idMatch[1];
                // Deduplicate items
                if (!parsedVideos.some(v => v.id === videoId)) {
                    parsedVideos.push({ id: videoId, title: title, author: snippet.split('...')[0] || 'Web Video' });
                }
            }
        });

        renderInterfaceCards(parsedVideos);
    }

    // Direct alternative failover configuration using standard lookup strings if parent node structure shifts
    async function fallbackQueryAlternative(query) {
        try {
            const backupUrl = `https://allorigins.win{encodeURIComponent('https://duckduckgo.com' + query + ' site:youtube.com/watch')}`;
            const res = await fetch(backupUrl);
            const data = await res.json();
            
            const parser = new DOMParser();
            const doc = parser.parseFromString(data.contents, 'text/html');
            const links = doc.querySelectorAll('.result__snippet, .result__url, a');
            const foundIds = [];
            
            links.forEach(el => {
                const text = el.href || el.textContent || '';
                const match = text.match(/[a-zA-Z0-9_-]{11}/);
                if (match && text.includes('watch')) {
                    foundIds.push(match[0]);
                }
            });

            // Unique items arrays transformation mapping logic
            const finalDataset = [...new Set(foundIds)].map(id => ({ id: id, title: `Video Content (${id})`, author: 'Media Stream' }));
            renderInterfaceCards(finalDataset);
        } catch(e) {
            statusMessage.textContent = 'Search temporary blocked. Please use general text queries or retry in a few moments.';
        }
    }

    function renderInterfaceCards(videos) {
        if (videos.length === 0) {
