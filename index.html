<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static Search & Media Dashboard</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --container-bg: #1f1f1f;
            --accent-color: #ff0000;
            --accent-hover: #cc0000;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #3f3f3f;
            --card-hover: #2a2a2a;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .dashboard-container {
            max-width: 1000px;
            width: 100%;
            background-color: var(--container-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            font-size: 26px;
        }

        .search-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-main);
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        button {
            padding: 12px 24px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        /* 16:9 Player Viewport */
        .player-window {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            background-color: #000;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
            display: none; /* Hidden until a video is loaded */
        }

        .player-window iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Search Results Grid */
        .results-heading {
            font-size: 18px;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
            display: none;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }

        .video-card {
            background-color: var(--bg-color);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid transparent;
            transition: transform 0.2s, background-color 0.2s, border-color 0.2s;
        }

        .video-card:hover {
            transform: translateY(-4px);
            background-color: var(--card-hover);
            border-color: var(--border-color);
        }

        .video-card img {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            display: block;
        }

        .video-info {
            padding: 10px;
        }

        .video-title {
            font-size: 14px;
            font-weight: 600;
            margin: 0 0 6px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
        }

        .video-author {
            font-size: 12px;
            color: var(--text-muted);
            margin: 0;
        }

        .status-msg {
            text-align: center;
            color: var(--text-muted);
            padding: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <h1>Searchable Static Dashboard</h1>
    
    <div class="search-row">
        <input type="text" id="searchQuery" placeholder="Type a video title here..." autocomplete="off">
        <button id="searchBtn">Search</button>
    </div>

    <!-- Embedded Player Unit -->
    <div class="player-window" id="playerContainer">
        <iframe id="videoEmbed" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
    </div>

    <!-- Search Results Section -->
    <div class="results-heading" id="resultsTitle">Search Results</div>
    <div id="statusMessage" class="status-msg">Enter a title above to look up videos.</div>
    <div class="results-grid" id="resultsGrid"></div>
</div>

<script>
    const searchBtn = document.getElementById('searchBtn');
    const searchQuery = document.getElementById('searchQuery');
    const resultsGrid = document.getElementById('resultsGrid');
    const resultsTitle = document.getElementById('resultsTitle');
    const statusMessage = document.getElementById('statusMessage');
    const playerContainer = document.getElementById('playerContainer');
    const videoEmbed = document.getElementById('videoEmbed');

    // Using a reliable public API hub instance for fetching search results
    const apiGatewayInstance = 'https://yewtu.be';

    searchBtn.addEventListener('click', executeVideoSearch);
    searchQuery.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') executeVideoSearch();
    });

    async function executeVideoSearch() {
        const query = searchQuery.value.trim();
        if (!query) return;

        // Visual feedback states
        statusMessage.textContent = 'Searching items... Please wait.';
        statusMessage.style.display = 'block';
        resultsGrid.innerHTML = '';
        resultsTitle.style.display = 'none';

        try {
            // Request clean structured data using v1 public search protocol
            const targetUrl = `${apiGatewayInstance}/api/v1/search?q=${encodeURIComponent(query)}&type=video`;
            const response = await fetch(targetUrl);
            
            if (!response.ok) throw new Error('Network query failure.');
            
            const datasets = await response.json();
            displayGridResults(datasets);
        } catch (error) {
            console.error(error);
            statusMessage.textContent = 'Unable to fetch results. Please try a different query or wait a moment.';
        }
    }

    function displayGridResults(items) {
        if (!items || items.length === 0) {
            statusMessage.textContent = 'No matching videos found.';
            return;
        }

        statusMessage.style.display = 'none';
        resultsTitle.style.display = 'block';

        items.forEach(item => {
            // Safeguard against objects missing core parameters
            if (item.type !== 'video' || !item.videoId) return;

            const card = document.createElement('div');
            card.className = 'video-card';
            
            // Extract the highest resolution thumbnail from dataset safely
            const thumbnailSrc = item.videoThumbnails && item.videoThumbnails.length > 0 
                ? item.videoThumbnails[0].url 
                : 'https://unsplash.com';

            card.innerHTML = `
                <img src="${thumbnailSrc}" alt="Preview thumbnail" onerror="this.src='https://unsplash.com'">
                <div class="video-info">
                    <p class="video-title">${escapeHtml(item.title)}</p>
                    <p class="video-author">${escapeHtml(item.author || 'Unknown Channel')}</p>
                </div>
            `;

            // Action listener to load video cleanly upon selection
            card.addEventListener('click', () => {
                playTargetVideo(item.videoId);
            });

            resultsGrid.appendChild(card);
        });
    }

    function playTargetVideo(id) {
        // Route player to standard cookie-compliant official endpoint securely
        videoEmbed.src = `https://youtube-nocookie.com{id}?autoplay=1`;
        playerContainer.style.display = 'block';
        
        // Soft auto-scroll up so the user immediately focuses on the playing video frame
        playerContainer.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // Helper syntax sanitizer to minimize cross-site scripting risks during DOM injection
    function escapeHtml(text) {
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
